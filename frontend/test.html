<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reward Platform Test</title>
</head>
<body>

<h2>Login</h2>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<hr>

<h2>Usuario</h2>
<p>Coins: <span id="coins">0</span></p>

<hr>

<h2>Tareas</h2>
<button onclick="getTasks()">Cargar tareas</button>
<ul id="tasks"></ul>

<hr>

<h2>Retiro</h2>
<input id="amount" placeholder="Amount"><br><br>
<input id="wallet" placeholder="TRC20 Wallet"><br><br>
<button onclick="withdraw()">Solicitar retiro</button>

<script>
const API = "http://localhost:3000/api";
let token = "";
let currentSession = "";

// 🔐 LOGIN
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  token = data.token;

  alert("Login OK");
  getProfile();
}

// 👤 PERFIL
async function getProfile() {
  const res = await fetch(API + "/user/profile", {
    headers: { Authorization: "Bearer " + token }
  });

  const data = await res.json();
  document.getElementById("coins").innerText = data.coins;
}

// 🎯 TAREAS
async function getTasks() {
  const res = await fetch(API + "/tasks", {
    headers: { Authorization: "Bearer " + token }
  });

  const tasks = await res.json();
  const list = document.getElementById("tasks");
  list.innerHTML = "";

  tasks.forEach(task => {
    const li = document.createElement("li");

    li.innerHTML = `
      ${task.title} - ${task.reward} coins 
      <button onclick="startTask(${task.id})">Start</button>
    `;

    list.appendChild(li);
  });
}

// ▶️ START TASK
async function startTask(taskId) {
  const res = await fetch(API + "/tasks/start", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ taskId })
  });

  const data = await res.json();
  currentSession = data.sessionToken;

  alert("Task started, espera...");
}

// ✅ COMPLETE TASK
async function completeTask() {
  const res = await fetch(API + "/tasks/complete", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ sessionToken: currentSession })
  });

  const data = await res.json();

  alert(data.message);
  getProfile();
}

// 💰 RETIRO
async function withdraw() {
  const amount = document.getElementById("amount").value;
  const wallet = document.getElementById("wallet").value;

  const res = await fetch(API + "/withdrawals/request", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({ amount: parseFloat(amount), wallet })
  });

  const data = await res.json();
  alert(data.message);
}
</script>

<br><br>
<button onclick="completeTask()">Completar tarea</button>

</body>
</html>
