<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
</head>
<body>

<h2>User Dashboard</h2>

<button onclick="logout()">Logout</button>

<h3>Coins: <span id="coins">0</span></h3>

<hr>

<h3>Tareas</h3>
<button onclick="getTasks()">Load tasks</button>

<ul id="tasks"></ul>

<hr>

<h3>Retiro</h3>

<input id="amount" placeholder="Amount"><br><br>
<input id="wallet" placeholder="TRC20 wallet"><br><br>

<button onclick="withdraw()">Withdraw</button>

<script>

const API = "http://localhost:3000/api";
const token = localStorage.getItem("token");

let sessionToken = "";

if(!token){
window.location.href = "login.html";
}

getProfile();

async function getProfile(){

const res = await fetch(API + "/user/profile",{
headers:{
Authorization:"Bearer " + token
}
});

const data = await res.json();

document.getElementById("coins").innerText = data.coins;

}

async function getTasks(){

const res = await fetch(API + "/tasks",{
headers:{
Authorization:"Bearer " + token
}
});

const tasks = await res.json();

const list = document.getElementById("tasks");

list.innerHTML = "";

tasks.forEach(task=>{

const li = document.createElement("li");

li.innerHTML = `
${task.title} - ${task.reward}
<button onclick="startTask(${task.id})">Start</button>
`;

list.appendChild(li);

});

}

async function startTask(taskId){

const res = await fetch(API + "/tasks/start",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer " + token
},
body: JSON.stringify({ taskId })
});

const data = await res.json();

sessionToken = data.sessionToken;

alert("Started");

}

async function completeTask(){

const res = await fetch(API + "/tasks/complete",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer " + token
},
body: JSON.stringify({ sessionToken })
});

const data = await res.json();

alert(data.message);

getProfile();

}

async function withdraw(){

const amount = document.getElementById("amount").value;
const wallet = document.getElementById("wallet").value;

const res = await fetch(API + "/withdrawals/request",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer " + token
},
body: JSON.stringify({ amount, wallet })
});

const data = await res.json();

alert(data.message);

}

function logout(){
localStorage.removeItem("token");
window.location.href="login.html";
}

</script>

<br><br>
<button onclick="completeTask()">Complete Task</button>

</body>
</html>
